<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVENIR Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: url('BG.jpeg') center center / cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(1px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1280px;
      padding: 40px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .logo-box img {
      height: 180px;
      width: auto;
      display: block;
      position: absolute;
      top: 30px;
      left: 40px;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-top: 100px;
    }

    .menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 100px;
      text-decoration: none;
      color: white;
      font-weight: 900;
      font-size: 3rem;
      line-height: 1;
      text-align: center;
      border-radius: 8px;
      box-shadow:
        12px 12px 0 rgba(0,0,0,0.25),
        0 12px 25px rgba(0,0,0,0.18);
      transition: all 0.25s ease;
      text-shadow:
        -3px -3px 0 #9a7fb3,
         3px -3px 0 #9a7fb3,
        -3px  3px 0 #9a7fb3,
         3px  3px 0 #9a7fb3;
      letter-spacing: 1px;
    }

    .menu-button:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow:
        16px 16px 0 rgba(0,0,0,0.22),
        0 18px 35px rgba(0,0,0,0.22);
    }

    .btn-pnbp {
      background: #8c5726;
    }

    .btn-rm {
      background: #7a675a;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .book-image {
      max-width: 620px;
      width: 100%;
      filter: drop-shadow(0 25px 30px rgba(0,0,0,0.35));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .avenir-logo {
      max-width: 220px;
      width: 55%;
      opacity: 0.9;
    }

    @media (max-width: 992px) {
       .left-panel {
        transform: translateY(-60px);
      }
      .container {
        flex-direction: column;
        text-align: center;
        padding: 120px 20px 40px;
      }

      .menu-button {
        width: 280px;
        height: 90px;
        font-size: 2.5rem;
      }

      .book-image {
        max-width: 520px;
      }

      .logo-box {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .logo-box img {
      width: 260px;
      height: auto;
      position: relative;
      top: unset;
      left: unset;
    }
  }
    @media (max-width: 576px) {
       .left-panel {
        transform: translateY(-60px);
      }
      .menu-button {
        width: 250px;
        height: 85px;
        font-size: 2rem;
      }

      .book-image {
        max-width: 320px;
      }

      .avenir-logo {
        max-width: 150px;
        transform: translateY(-80px);
      }
    }
  </style>
</head>
<body>

  <div class="logo-box">
    <img src="LOGOO.png" alt="Kantor Imigrasi Bitung">
  </div>

  <div class="container">
    <div class="left-panel">
      <a
        href="https://docs.google.com/spreadsheets/d/1rZX7ZU3oKJakSZWuG3k_R3Z2SHHShkY2XzxAksOkCWo/edit?usp=sharing"
        target="_blank"
        class="menu-button btn-pnbp"
      >
        NODIN<br>PNBP
      </a>

      <a
        href="https://docs.google.com/spreadsheets/d/1vFkf-tKtZkjqWRyfxIf9vVRP1-8YXXYe47j5Rd5l0ME/edit?usp=drivesdk"
        target="_blank"
        class="menu-button btn-rm"
      >
        NODIN<br>RM
      </a>
    </div>

    <div class="right-panel">
      <img src="ester.png" alt="Ilustrasi Buku" class="book-image">
      <img src="fix.png" alt="AVENIR" class="avenir-logo">
    </div>
  </div>

</body>
</html>
